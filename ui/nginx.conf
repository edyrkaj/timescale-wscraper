server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static UI only — API runs separately (default :8080)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|html)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
