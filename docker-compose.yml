services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-scrapers_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-scrapers_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:password@timescaledb:5432/scrapers_db}
      BIND_ADDR: ${BIND_ADDR:-0.0.0.0:8080}
      RUST_LOG: ${RUST_LOG:-info}
      PLAYWRIGHT_URL: ${PLAYWRIGHT_URL:-http://playwright:3001}
      CHROME_PATH: ${CHROME_PATH:-/usr/lib/chromium/chromium}
      USE_XVFB: ${USE_XVFB:-1}
      HEADLESS: ${HEADLESS:-0}
      DISPLAY: ${DISPLAY:-:99}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.meta.ai}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-${MODEL_API_KEY:-}}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-muse-spark-1.3-contributor}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      GEMINI_FALLBACK_MODELS: ${GEMINI_FALLBACK_MODELS:-}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://host.docker.internal:8000/v1}
      VLLM_MODEL: ${VLLM_MODEL:-Qwen/Qwen3-8B}
    depends_on:
      timescaledb:
        condition: service_healthy
      playwright:
        condition: service_healthy
    shm_size: "1gb"

  ui:
    image: nginx:1.27-alpine
    ports:
      - "${UI_PORT:-3000}:80"
    volumes:
      - ./static:/usr/share/nginx/html:ro
      - ./ui/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  playwright:
    build: ./playwright
    env_file:
      - .env
    environment:
      HEADLESS: ${HEADLESS:-0}
      PLAYWRIGHT_BROWSER: ${PLAYWRIGHT_BROWSER:-chromium}
      PORT: 3001
    ports:
      - "${PLAYWRIGHT_PORT:-3001}:3001"
    shm_size: "1gb"
    init: true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  timescale_data:
