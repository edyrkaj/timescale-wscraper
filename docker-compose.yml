services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-scrapers_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-scrapers_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:password@timescaledb:5432/scrapers_db}
      BIND_ADDR: ${BIND_ADDR:-0.0.0.0:8080}
      RUST_LOG: ${RUST_LOG:-info}
      CHROME_PATH: ${CHROME_PATH:-/usr/bin/chromium}
    depends_on:
      timescaledb:
        condition: service_healthy
    shm_size: "1gb"

volumes:
  timescale_data:
